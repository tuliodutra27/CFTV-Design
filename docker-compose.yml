services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cftv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cftv}
      POSTGRES_DB: ${POSTGRES_DB:-cftv_design}
    ports:
      - "5032:5432"
    volumes:
      - cftv_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cftv} -d ${POSTGRES_DB:-cftv_design}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cftv:cftv@db:5432/cftv_design?schema=public}
      NODE_ENV: development
      WATCHPACK_POLLING: "true" # necessário para hot-reload funcionar com bind mount no Windows/Docker Desktop
      SESSION_SECRET: ${SESSION_SECRET}
      AD_SERVER: ${AD_SERVER}
      AD_PORT: ${AD_PORT:-389}
      AD_USE_SSL: ${AD_USE_SSL:-false}
      AD_DOMAIN: ${AD_DOMAIN}
      AD_BASE_DN: ${AD_BASE_DN}
      AD_ADMIN_GROUP_CN: ${AD_ADMIN_GROUP_CN}
      AD_OPERATOR_GROUP_CN: ${AD_OPERATOR_GROUP_CN}
      DEV_MODE: ${DEV_MODE:-false}
      DEV_USERS: ${DEV_USERS:-} # vazio == "{}" (tratado no código)
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - cftv_node_modules:/app/node_modules
      - cftv_next_cache:/app/.next

volumes:
  cftv_db_data:
  cftv_node_modules:
  cftv_next_cache:
